# Build the txs status page and publish it to S3 + CloudFront.
# Reusable publish workflow lives in humanity-org/devops (docs/app-cicd.md,
# docs/frontend-build-matrix.md).
name: build-publish

on:
  push:
    branches: [staging, production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: yarn install
      - name: Build
        run: yarn build
        env:
          VITE_CONFIG_SERVICE_URL: ${{ github.ref_name == 'production' && 'https://config.safe.humanity.org' || 'https://config.staging.safe.humanity.org' }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build

  publish:
    needs: build
    uses: humanity-org/ci-workflows/.github/workflows/reusable-static-publish.yml@main
    with:
      artifact-name: site
      bucket-name: humanity-safe-${{ github.ref_name }}-status
      distribution-id: ${{ github.ref_name == 'production' && vars.SAFE_STATUS_DIST_ID_PRODUCTION || vars.SAFE_STATUS_DIST_ID_STAGING }}
    permissions:
      id-token: write
